[project]
name = "chesslens"
version = "0.1.0"
description = "Recognise a chess position from a photo of a physical board"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
